<title>Apartment Checklist</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0;}
  :root{
    --bg:#F5F0E8; --ink:#1C1917; --muted:#78716C; --accent:#C4623A;
    --serif:Georgia,'Times New Roman',serif;
    --sans:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  }
  html,body{background:var(--bg);}
  body{font-family:var(--sans);color:var(--ink);min-height:640px;}
  h1,h2{font-family:var(--serif);}
  ::-webkit-scrollbar{width:8px;height:8px;}
  ::-webkit-scrollbar-track{background:#EDE8DF;}
  ::-webkit-scrollbar-thumb{background:var(--accent);border-radius:4px;}
  @keyframes slideDown{from{opacity:0;transform:translateY(-5px)}to{opacity:1;transform:translateY(0)}}

  .header{background:var(--ink);color:var(--bg);padding:28px 20px 24px;}
  .wrap{max-width:680px;margin:0 auto;}
  .eyebrow{font-size:12px;font-weight:600;letter-spacing:.12em;color:#A8A29E;text-transform:uppercase;margin-bottom:6px;}
  .title{font-size:28px;font-weight:700;line-height:1.2;margin-bottom:16px;}
  .progress-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;font-size:13px;}
  .progress-row .left{color:#A8A29E;}
  .progress-row .pct{font-weight:600;color:var(--accent);}
  .progress-row .pct.done{color:#86EFAC;}
  .bar{height:6px;background:#3C3836;border-radius:3px;overflow:hidden;}
  .bar > div{height:100%;background:linear-gradient(90deg,#C4623A,#E8895A);border-radius:3px;transition:width .3s;}
  .info{margin-top:14px;background:#2C2927;border-radius:10px;padding:10px 14px;font-size:11px;color:#A8A29E;}
  .cards{margin-top:12px;display:flex;gap:12px;flex-wrap:wrap;}
  .stat{background:#2C2927;border-radius:10px;padding:10px 16px;flex:1;min-width:140px;}
  .stat .k{font-size:11px;color:#A8A29E;margin-bottom:2px;}
  .stat .v{font-family:var(--serif);font-size:20px;font-weight:600;color:var(--bg);}
  .stat .v.green{color:#86EFAC;}

  .filters{background:#EDE8DF;border-bottom:1px solid #D6CFC5;padding:12px 16px;}
  .srow{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;}
  .srow::-webkit-scrollbar{display:none;}
  .cbtn{cursor:pointer;border:none;background:#EDE8DF;color:var(--muted);padding:8px 14px;border-radius:20px;font-family:var(--sans);font-size:13px;font-weight:500;white-space:nowrap;transition:all .1s;}
  .cbtn:hover{background:#E2D9CE;color:#44403C;}
  .cbtn.on{background:var(--accent);color:#fff;}
  .prow{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;}
  .pbtn{cursor:pointer;border:1.5px solid #D6CFC5;background:transparent;color:var(--muted);padding:6px 14px;border-radius:20px;font-family:var(--sans);font-size:12px;font-weight:500;transition:all .1s;}

  .list{max-width:680px;margin:0 auto;padding:16px;}
  .cat{margin-bottom:24px;}
  .cathead{display:flex;align-items:center;gap:8px;margin-bottom:10px;cursor:pointer;user-select:none;}
  .cathead:hover h2{color:var(--accent);}
  .cathead .icon{font-size:18px;}
  .cathead h2{font-size:17px;font-weight:600;transition:color .15s;}
  .cathead .count{font-size:12px;color:#A8A29E;}
  .chev{font-size:11px;color:#A8A29E;transition:transform .2s;margin-left:auto;}
  .chev.closed{transform:rotate(-90deg);}
  .catdel{cursor:pointer;border:none;background:none;color:#C4C0B8;font-size:13px;padding:2px 6px;border-radius:6px;transition:all .15s;}
  .catdel:hover{color:#991B1B;background:#FEE2E2;}
  .catedit{cursor:pointer;border:none;background:none;color:#C4C0B8;font-size:13px;padding:2px 6px;border-radius:6px;margin-left:auto;transition:all .15s;}
  .catedit:hover{color:var(--accent);background:#FFF0EB;}
  .catedit + .catdel{margin-left:0;}
  .catedit + .chev, .catdel + .chev{margin-left:8px;}
  .assignee{font-size:11px;background:#F3F0FF;color:#6D28D9;border-radius:8px;padding:2px 8px;font-weight:500;}

  .items{display:flex;flex-direction:column;gap:6px;}
  .card{background:#fff;border-radius:12px;border:1.5px solid #F0EBE1;overflow:hidden;transition:border-color .1s;}
  .card:hover{border-color:#DDD5C8;}
  .card.editing{border-color:var(--accent);}
  .card.done{opacity:.55;}
  .card.hiddenrow{opacity:.6;}
  .irow{display:flex;align-items:flex-start;gap:12px;padding:12px 14px;cursor:pointer;}
  .irow:hover{background:#FDFAF6;}
  .box{width:20px;height:20px;border-radius:6px;border:2px solid #D6CFC5;flex-shrink:0;margin-top:2px;display:flex;align-items:center;justify-content:center;transition:all .15s;}
  .box.on{background:var(--accent);border-color:var(--accent);}
  .box svg{display:block;}
  .iname{font-size:14px;font-weight:500;color:var(--ink);}
  .card.done .iname{font-weight:400;text-decoration:line-through;color:#A8A29E;}
  .meta{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:5px;}
  .pill{font-size:11px;font-weight:600;padding:2px 9px;border-radius:8px;}
  .cost{font-size:12px;color:var(--muted);font-weight:500;}
  .where{font-size:11px;background:#F0F6FF;color:#2563EB;border-radius:8px;padding:2px 8px;font-weight:500;}
  .note{font-size:12px;color:var(--muted);margin-top:5px;font-style:italic;}
  .linkchip{display:inline-flex;align-items:center;gap:4px;margin-top:5px;font-size:11px;color:#2563EB;text-decoration:none;background:#EFF6FF;border-radius:6px;padding:2px 8px;border:1px solid #BFDBFE;}
  .eico{cursor:pointer;border:none;background:none;padding:4px 8px;border-radius:8px;font-size:14px;color:#C4C0B8;transition:all .15s;flex-shrink:0;}
  .eico:hover,.eico.on{color:var(--accent);background:#FFF0EB;}

  .panel{border-top:1px solid #F0EBE1;background:#FDFAF6;padding:14px;animation:slideDown .15s ease;}
  .lbl{font-size:11px;font-weight:600;color:var(--muted);margin-bottom:5px;text-transform:uppercase;letter-spacing:.08em;display:block;}
  .inp{width:100%;border:1.5px solid #E2D9CE;border-radius:8px;padding:8px 10px;font-family:var(--sans);font-size:13px;color:var(--ink);background:#fff;outline:none;transition:border-color .15s;}
  .inp:focus{border-color:var(--accent);}
  .inp::placeholder{color:#C4A99A;}
  textarea.inp{resize:none;}
  .ppill{cursor:pointer;border:1.5px solid #E2D9CE;background:none;color:var(--muted);border-radius:16px;padding:5px 14px;font-size:12px;font-weight:500;font-family:var(--sans);transition:all .15s;}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
  .panel-foot{margin-top:14px;padding-top:12px;border-top:1px solid #F0EBE1;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;}
  .sbtn{cursor:pointer;background:var(--accent);color:#fff;border:none;border-radius:8px;padding:8px 18px;font-family:var(--sans);font-size:13px;font-weight:600;}
  .sbtn:disabled{opacity:.4;cursor:default;}
  .xbtn{cursor:pointer;background:none;border:1.5px solid #E2D9CE;border-radius:8px;padding:8px 14px;font-family:var(--sans);font-size:13px;color:var(--muted);}
  .dbtn{cursor:pointer;background:none;border:1.5px solid #FECACA;border-radius:8px;padding:6px 14px;font-family:var(--sans);font-size:12px;font-weight:500;color:#991B1B;transition:all .15s;}
  .dbtn:hover{background:#FEE2E2;}
  .dbtn.confirm{background:#FEE2E2;font-weight:600;}
  .addbtn{cursor:pointer;border:1.5px dashed #D6CFC5;background:none;border-radius:10px;padding:10px 14px;font-family:var(--sans);font-size:13px;color:#A8A29E;width:100%;text-align:left;transition:all .15s;}
  .addbtn:hover{border-color:var(--accent);color:var(--accent);background:#FFF8F6;}
  .addform{background:#fff;border-radius:12px;border:1.5px solid var(--accent);padding:14px;animation:slideDown .15s ease;}
  .restorebtn{cursor:pointer;background:none;border:1.5px solid #D6CFC5;border-radius:8px;padding:5px 12px;font-family:var(--sans);font-size:12px;font-weight:600;color:#44403C;white-space:nowrap;transition:all .15s;}
  .restorebtn:hover{border-color:var(--accent);color:var(--accent);}
  .hidsec .cathead{background:#EDE8DF;border-radius:10px;padding:10px 14px;}
  .hidsec h2{font-size:16px;color:var(--muted);}
</style>

  "Week 1":{bg:"#FEF3C7",text:"#92400E",border:"#FDE68A"},

};
var KEY = "fremont-checklist-v1";

BASE.forEach(function(i){ totalLo += Number(i.lo)||0; totalHi += Number(i.hi)||0; });

// All categories = built-in + any custom ones the user added

var state = {

/* ─────────── Storage (localStorage cache) ─────────── */
function load(){

      state.checked = d.checked||{};

      state.custom = d.custom||[];
      state.customCats = d.customCats||[];
      state.catNames = d.catNames||{};
    }
  }catch(e){}
}

var FB_CONFIG = {
  apiKey: "AIzaSyD8Kx_ghZdFF81tt_Iq4fP1UU7Fu7_mR_E",

  messagingSenderId: "537916581347",
  appId: "1:537916581347:web:656e1c1ff1dc0c1640ecd6"
};

var dbRef = null;
var lastPushed = "";

function initFirebase(){
  if(typeof firebase === "undefined"){ state.syncStatus="offline"; updateSyncBadge(); return; }
  try{
    firebase.initializeApp(FB_CONFIG);
    var db = firebase.database();
    dbRef = db.ref("checklist");

    // connection indicator
    db.ref(".info/connected").on("value", function(snap){
      state.syncStatus = (snap.val()===true) ? "synced" : "offline";
      updateSyncBadge();
    });

    // live shared data
    dbRef.on("value", function(snap){
      var v = snap.val();
      if(v===null){
        // nothing in the cloud yet — seed it from whatever is local
        if(Object.keys(state.checked).length || Object.keys(state.edits).length || state.custom.length || state.customCats.length || Object.keys(state.catNames).length){
          pushToFirebase();
        }
        return;
      }
      var incoming = JSON.stringify({checked:v.checked||{}, edits:v.edits||{}, custom:v.custom||[], customCats:v.customCats||[], catNames:v.catNames||{}});
      if(incoming === lastPushed) return; // ignore the echo of our own write
      state.checked = v.checked||{};
      state.edits   = v.edits||{};
      state.custom  = v.custom||[];
      state.customCats = v.customCats||[];
      state.catNames = v.catNames||{};
      try{ localStorage.setItem(KEY, incoming); }catch(e){}
      // don't yank the UI out from under someone mid-edit
      if(state.editId===null && state.addingTo===null){ render(); }
    }, function(){ state.syncStatus="offline"; updateSyncBadge(); });
  }catch(e){
    console.error("Firebase init error:", e);
    state.syncStatus="offline"; updateSyncBadge();
  }
}

function pushToFirebase(){
  if(!dbRef) return;
  var payload = {checked:state.checked, edits:state.edits, custom:state.custom, customCats:state.customCats, catNames:state.catNames};
  lastPushed = JSON.stringify(payload);
  try{ dbRef.set(payload); }catch(e){ console.error("Firebase push error:", e); }
}

function syncBadgeHTML(){
  if(state.syncStatus==="synced")  return "✓ Live sync on — edits from both of you show up here automatically";
  if(state.syncStatus==="offline") return "Offline — saved on this device, will sync when reconnected";
  return "Connecting to live sync…";
}
function updateSyncBadge(){
  var el = document.getElementById("syncbadge");
  if(el) el.innerHTML = syncBadgeHTML();
}

/* persist = save locally AND push to the shared cloud */
function persist(){
  saveLocal();
  pushToFirebase();
}

/* ─────────── Helpers ─────────── */
function allItems(){ return BASE.concat(state.custom); }
function fieldOf(id,f){ return state.edits[id] ? state.edits[id][f] : undefined; }
function val(item,f){ var v = fieldOf(item.id,f); return (v===undefined||v===null) ? item[f] : v; }
function isHidden(item){ var v = fieldOf(item.id,"hidden"); return v===true; }
function isCustom(item){ return String(item.id).indexOf("c_")===0; }
function fmt(n){ n = Number(n)||0; return n>=1000 ? "$"+(n/1000).toFixed(1)+"k" : "$"+n; }
function esc(s){
  return String(s===undefined||s===null?"":s)
    .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;").replace(/'/g,"&#39;");
}
function dispName(item){ var v=fieldOf(item.id,"name"); return (v===undefined||v===null)?item.name:v; }
function dispPri(item){ var v=fieldOf(item.id,"pri"); return (v===undefined||v===null)?item.pri:v; }
function dispWhere(item){ var v=fieldOf(item.id,"where"); return (v===undefined||v===null)?item.where:v; }
function dispLo(item){ var v=fieldOf(item.id,"lo"); return (v===undefined||v===null)?item.lo:v; }
function dispHi(item){ var v=fieldOf(item.id,"hi"); return (v===undefined||v===null)?item.hi:v; }
// Single cost. Prefers an explicit cost (edit override or custom item),
// otherwise collapses any old low/high range to one representative number.
function dispCost(item){
  var ec = fieldOf(item.id,"cost");
  if(ec!==undefined && ec!==null && ec!=="") return Number(ec)||0;
  if(item.cost!==undefined && item.cost!==null) return Number(item.cost)||0;
  var elo = fieldOf(item.id,"lo"), ehi = fieldOf(item.id,"hi");
  var lo = (elo!==undefined&&elo!==null)?Number(elo):(Number(item.lo)||0);
  var hi = (ehi!==undefined&&ehi!==null)?Number(ehi):(Number(item.hi)||0);
  if(lo&&hi) return Math.round((lo+hi)/2);
  return hi||lo||0;
}
function dispNote(item){ var v=fieldOf(item.id,"note"); return v?v:""; }
function dispLink(item){ var v=fieldOf(item.id,"link"); return v?v:""; }
function dispAssignee(item){ var v=fieldOf(item.id,"assignee"); return v?v:""; }

var PRI_ORDER = {"Day 1":0,"Week 1":1,"Anytime":2};
function sortItems(items){
  if(state.sortMode==="default") return items;
  var arr = items.slice();
  if(state.sortMode==="priority"){
    arr.sort(function(a,b){
      var pa = PRI_ORDER[dispPri(a)]; if(pa===undefined) pa=3;
      var pb = PRI_ORDER[dispPri(b)]; if(pb===undefined) pb=3;
      return pa-pb;
    });
  } else if(state.sortMode==="unchecked"){
    arr.sort(function(a,b){
      var ca = state.checked[a.id]?1:0, cb = state.checked[b.id]?1:0;
      return ca-cb;
    });
  }
  return arr;
}

/* ─────────── Render ─────────── */
function render(){
  var all = allItems();
  var visible = all.filter(function(i){ return !isHidden(i); });
  var doneCount = visible.filter(function(i){ return state.checked[i.id]; }).length;
  var pct = visible.length ? Math.round(doneCount/visible.length*100) : 0;
  var hiddenItems = all.filter(function(i){ return isHidden(i); });
  var hiddenCt = hiddenItems.length;

  var filtered = all.filter(function(i){
    if(isHidden(i)) return false;
    if(state.catFilter!=="All" && i.cat!==state.catFilter) return false;
    if(state.priFilter!=="All" && dispPri(i)!==state.priFilter) return false;
    return true;
  });
  var remaining = filtered.filter(function(i){ return !state.checked[i.id]; });
  var stillNeed = visible.filter(function(i){ return !state.checked[i.id]; }).length;

  // budgets over ALL visible items (stable regardless of filter)
  var spent=0, left=0;
  visible.forEach(function(i){
    var cost = Number(dispCost(i))||0;
    if(state.checked[i.id]){ spent+=cost; } else { left+=cost; }
  });
  var total = spent+left;

  var h = "";

  /* Header */

  h += '<span class="pct'+(pct===100?' done':'')+'">'+pct+'%</span></div>';
  h += '<div class="bar"><div style="width:'+pct+'%"></div></div>';
  h += '<div class="info" id="syncbadge">'+syncBadgeHTML()+'</div>';
  h += '<div class="cards">';
  h += '<div class="stat"><div class="k">Bought (est.)</div><div class="v green">'+fmt(spent)+'</div></div>';
  h += '<div class="stat"><div class="k">Left to buy (est.) &middot; '+stillNeed+' items</div><div class="v">'+fmt(left)+'</div></div>';
  h += '</div>';
  h += '<p style="margin-top:10px;font-size:12px;color:#A8A29E;">Full apartment estimate: <span style="color:#F5F0E8;font-weight:600;">'+fmt(totalLo)+' &ndash; '+fmt(totalHi)+'</span></p>';
  h += '</div></div>';

  /* Filters */
  h += '<div class="filters"><div class="wrap">';
  h += '<div class="srow">';
  ["All"].concat(allCats()).forEach(function(c){
    h += '<button class="cbtn'+(state.catFilter===c?' on':'')+'" data-act="catfilter" data-cat="'+esc(c)+'">'+(c!=="All"?catIcon(c)+" ":"")+esc(c)+'</button>';
  });
  h += '</div>';
  h += '<div class="prow">';
  ["All"].concat(PRIORITIES).forEach(function(p){
    var on = state.priFilter===p;
    var s = PRI_STYLE[p];
    var style = on ? (s? 'background:'+s.bg+';border-color:'+s.border+';color:'+s.text+';' : 'background:#1C1917;border-color:#1C1917;color:#F5F0E8;') : '';
    h += '<button class="pbtn" style="'+style+'" data-act="prifilter" data-pri="'+esc(p)+'">'+esc(p)+'</button>';
  });
  h += '</div>';
  h += '<div class="prow" style="margin-top:6px;align-items:center;">';
  h += '<span style="font-size:11px;color:#78716C;font-weight:600;text-transform:uppercase;letter-spacing:.06em;margin-right:2px;">Sort</span>';
  [["default","Default"],["priority","Priority"],["unchecked","To-do first"]].forEach(function(o){
    var on = state.sortMode===o[0];
    var style = on ? 'background:#1C1917;border-color:#1C1917;color:#F5F0E8;' : '';
    h += '<button class="pbtn" style="'+style+'" data-act="setsort" data-sort="'+o[0]+'">'+o[1]+'</button>';
  });
  h += '</div>';
  h += '</div></div>';

  /* List */
  h += '<div class="list">';
  allCats().forEach(function(cat){
    var items = filtered.filter(function(i){ return i.cat===cat; });
    var isAdding = state.addingTo===cat;
    var isCustomCat = (state.customCats||[]).indexOf(cat) > -1;
    if(items.length===0 && !isAdding && !isCustomCat) return;
    var collapsed = !!state.collapsed[cat];
    var catDone = items.filter(function(i){ return state.checked[i.id]; }).length;
    var renaming = state.renamingCat===cat;

    items = sortItems(items);

    h += '<div class="cat">';
    if(renaming){
      h += '<div class="addform" data-stop="1" style="margin-bottom:10px;">';
      h += '<label class="lbl" style="margin-bottom:6px;">Rename category</label>';
      h += '<input class="inp" data-field="catrename" value="'+esc(state.catRenameDraft)+'" placeholder="'+esc(catDisplay(cat))+'">';
      h += '<div style="display:flex;gap:8px;margin-top:14px;">';
      h += '<button class="sbtn"'+(state.catRenameDraft.trim()?'':' disabled')+' data-act="saverenamecat" data-cat="'+esc(cat)+'">Save</button>';
      h += '<button class="xbtn" data-act="cancelrenamecat">Cancel</button>';
      h += '</div></div>';
    } else {
      h += '<div class="cathead" data-act="togglecat" data-cat="'+esc(cat)+'">';
      h += '<span class="icon">'+catIcon(cat)+'</span>';
      h += '<h2>'+esc(catDisplay(cat))+'</h2>';
      h += '<span class="count">'+catDone+'/'+items.length+'</span>';
      h += '<button class="catedit" data-act="renamecat" data-cat="'+esc(cat)+'" title="Rename category">✏️</button>';
      if(isCustomCat){
        h += '<button class="catdel" data-act="delcat" data-cat="'+esc(cat)+'" title="Remove category">✕</button>';
      }
      h += '<span class="chev'+(collapsed?' closed':'')+'">\u25BC</span>';
      h += '</div>';
    }

    if(!collapsed && !renaming){
      h += '<div class="items">';
      items.forEach(function(item){ h += itemCard(item); });
      if(isAdding){ h += addForm(cat); }
      else if(state.catFilter==="All" || state.catFilter===cat){
        h += '<button class="addbtn" data-act="showadd" data-cat="'+esc(cat)+'"><span style="font-size:16px;line-height:1">+</span> Add item to '+esc(catDisplay(cat))+'</button>';
      }
      h += '</div>';

      h += '<div class="addform" data-stop="1" style="margin-bottom:24px;">';
      h += '<label class="lbl" style="margin-bottom:6px;">New category</label>';

function itemCard(item){
  var done = !!state.checked[item.id];
  var open = state.editId===item.id;
  var pri = dispPri(item);
  var ps = PRI_STYLE[pri] || PRI_STYLE["Week 1"];
  var lo = dispLo(item), hi = dispHi(item);
  var where = dispWhere(item);
  var note = dispNote(item);
  var link = dispLink(item);
  var pending = state.confirmId===item.id;
  var custom = isCustom(item);

  var c = '<div class="card'+(open?' editing':'')+(done?' done':'')+'">';

  /* main row */
  c += '<div class="irow" data-act="toggle" data-id="'+esc(item.id)+'">';
  c += '<div class="box'+(done?' on':'')+'">'+(done?'<svg width="12" height="12" viewBox="0 0 12 12"><polyline points="2,6 5,9 10,3" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round"/></svg>':'')+'</div>';
  c += '<div style="flex:1;min-width:0;">';
  c += '<div style="margin-bottom:5px;"><span class="iname">'+esc(dispName(item))+'</span></div>';
  c += '<div class="meta">';
  c += '<span class="pill" style="background:'+ps.bg+';color:'+ps.text+';border:1px solid '+ps.border+';">'+esc(pri)+'</span>';
  if(Number(lo)||Number(hi)){ c += '<span class="cost">'+fmt(lo)+'&ndash;'+fmt(hi)+'</span>'; }
  if(where && where!=="-"){ c += '<span class="where">🛒 '+esc(where)+'</span>'; }
  var who = dispAssignee(item);
  if(who){ c += '<span class="assignee">👤 '+esc(who)+'</span>'; }
  c += '</div>';
  if(!open && note){ c += '<p class="note">"'+esc(note)+'"</p>'; }
  if(!open && link){
    var shortL = link.length>42 ? link.slice(0,42)+"…" : link;
    c += '<a class="linkchip" href="'+esc(link)+'" target="_blank" rel="noreferrer" data-stop="1">🔗 '+esc(shortL)+'</a>';
  }
  c += '</div>';
  c += '<button class="eico'+(open?' on':'')+'" data-act="'+(open?'canceledit':'openedit')+'" data-id="'+esc(item.id)+'">✏️</button>';
  c += '</div>';

  /* edit panel */
  if(open){
    var d = state.draftEdits || {};
    c += '<div class="panel" data-stop="1">';
    c += '<label class="lbl">Name</label>';
    c += '<input class="inp" data-field="name" value="'+esc(d.name)+'" placeholder="'+esc(item.name)+'">';

    c += '<label class="lbl" style="margin-top:12px;">Priority</label>';
    c += '<div style="display:flex;gap:6px;flex-wrap:wrap;">';
    PRIORITIES.forEach(function(p){
      var sel = (d.pri||item.pri)===p; var pp=PRI_STYLE[p];
      var st = sel ? 'background:'+pp.bg+';border-color:'+pp.border+';color:'+pp.text+';' : '';
      c += '<button class="ppill" style="'+st+'" data-act="setpri" data-id="'+esc(item.id)+'" data-pri="'+esc(p)+'">'+esc(p)+'</button>';
    });
    c += '</div>';

    c += '<label class="lbl" style="margin-top:12px;">Where to buy</label>';
    c += '<input class="inp" data-field="where" value="'+esc(d.where)+'" placeholder="e.g. Amazon, Target">';

    c += '<div class="grid2" style="margin-top:12px;">';
    c += '<div><label class="lbl" style="margin-bottom:4px;">Cost low ($)</label><input class="inp" type="number" data-field="lo" value="'+esc(d.lo)+'"></div>';
    c += '<div><label class="lbl" style="margin-bottom:4px;">Cost high ($)</label><input class="inp" type="number" data-field="hi" value="'+esc(d.hi)+'"></div>';
    c += '</div>';

    c += '<label class="lbl" style="margin-top:12px;">Note</label>';
    c += '<textarea class="inp" rows="2" data-field="note" placeholder="Any notes">'+esc(d.note)+'</textarea>';

    c += '<label class="lbl" style="margin-top:12px;">Link</label>';
    c += '<input class="inp" type="url" data-field="link" value="'+esc(d.link)+'" placeholder="https://">';

    c += '<label class="lbl" style="margin-top:12px;">Assigned to</label>';
    c += '<input class="inp" data-field="assignee" value="'+esc(d.assignee)+'" placeholder="e.g. Me, or a name">';

    c += '<div class="panel-foot">';
    c += '<div>';
    if(pending){
      c += '<span style="font-size:12px;color:#991B1B;margin-right:8px;">Are you sure?</span>';
      c += '<button class="dbtn confirm" data-act="confirmdel" data-id="'+esc(item.id)+'">'+(custom?'Yes, delete':'Yes, hide')+'</button> ';
      c += '<button class="xbtn" style="font-size:12px;" data-act="canceldel">No</button>';
    } else {
      c += '<button class="dbtn" data-act="askdel" data-id="'+esc(item.id)+'">'+(custom?'🗑️ Delete':'🙈 Hide')+'</button>';
    }
    c += '</div>';
    c += '<div style="display:flex;gap:8px;">';
    c += '<button class="xbtn" data-act="canceledit" data-id="'+esc(item.id)+'">Cancel</button>';
    c += '<button class="sbtn" data-act="saveedit" data-id="'+esc(item.id)+'">Save</button>';
    c += '</div>';
    c += '</div>';
    c += '</div>';
  }

  c += '</div>';
  return c;
}

function addForm(cat){
  var d = state.draft;
  var c = '<div class="addform" data-stop="1">';
  c += '<label class="lbl" style="margin-bottom:6px;">New item &mdash; '+esc(cat)+'</label>';
  c += '<input class="inp" data-field="add-name" value="'+esc(d.name)+'" placeholder="Item name">';
  c += '<label class="lbl" style="margin-top:10px;margin-bottom:6px;">Priority</label>';
  c += '<div style="display:flex;gap:6px;">';
  PRIORITIES.forEach(function(p){
    var sel = d.pri===p; var pp=PRI_STYLE[p];
    var st = sel ? 'background:'+pp.bg+';border-color:'+pp.border+';color:'+pp.text+';' : '';
    c += '<button class="ppill" style="'+st+'" data-act="addsetpri" data-pri="'+esc(p)+'">'+esc(p)+'</button>';
  });
  c += '</div>';
  c += '<label class="lbl" style="margin-top:10px;margin-bottom:4px;">Where to buy</label>';
  c += '<input class="inp" data-field="add-where" value="'+esc(d.where)+'" placeholder="e.g. Amazon / Target">';
  c += '<div class="grid2" style="margin-top:10px;">';
  c += '<div><label class="lbl" style="margin-bottom:4px;">Cost low ($)</label><input class="inp" type="number" data-field="add-lo" value="'+esc(d.lo)+'"></div>';
  c += '<div><label class="lbl" style="margin-bottom:4px;">Cost high ($)</label><input class="inp" type="number" data-field="add-hi" value="'+esc(d.hi)+'"></div>';
  c += '</div>';
  c += '<div style="display:flex;gap:8px;margin-top:14px;">';
  c += '<button class="sbtn"'+(d.name.trim()?'':' disabled')+' data-act="submitadd" data-cat="'+esc(cat)+'">Add</button>';
  c += '<button class="xbtn" data-act="canceladd">Cancel</button>';
  c += '</div>';
  c += '</div>';
  return c;
}

/* ─────────── Actions ─────────── */
function initDraft(item){
  return {
    name: dispName(item), pri: dispPri(item), where: dispWhere(item),
    lo: dispLo(item), hi: dispHi(item), note: dispNote(item), link: dispLink(item),
    assignee: dispAssignee(item)
  };
}

function handleClick(e){
  var stop = e.target.closest('[data-stop]');
  var el = e.target.closest('[data-act]');
  // allow links to work
  if(e.target.closest('a.linkchip')) return;
  if(!el) return;
  var act = el.getAttribute('data-act');
  var id = el.getAttribute('data-id');
  var cat = el.getAttribute('data-cat');
  var pri = el.getAttribute('data-pri');

  // numeric-ish ids: keep as original type by matching against items
  function findItem(rawId){
    var all = allItems();
    for(var i=0;i<all.length;i++){ if(String(all[i].id)===String(rawId)) return all[i]; }
    return null;
  }

  switch(act){
    case "toggle":
      state.checked[idKey(id)] = !state.checked[idKey(id)];
      persist(); render(); break;
    case "togglecat":
      state.collapsed[cat] = !state.collapsed[cat]; render(); break;
    case "togglehidden":
      state.showHiddenSec = !state.showHiddenSec; render(); break;
    case "catfilter":
      state.catFilter = cat; render(); break;
    case "prifilter":
      state.priFilter = pri; render(); break;
    case "openedit":
      var it = findItem(id);
      state.editId = it ? it.id : null;
      state.draftEdits = it ? initDraft(it) : null;
      state.confirmId = null; render(); break;
    case "canceledit":
      state.editId = null; state.draftEdits = null; state.confirmId = null; render(); break;
    case "saveedit":
      commitEdit(id); break;
    case "setpri":
      if(state.draftEdits) state.draftEdits.pri = pri; render(); break;
    case "askdel":
      state.confirmId = findItem(id) ? findItem(id).id : null; render(); break;
    case "canceldel":
      state.confirmId = null; render(); break;
    case "confirmdel":
      doDelete(id); break;
    case "restore":
      setHidden(id,false); render(); break;
    case "showadd":
      state.addingTo = cat; state.draft = {name:"",pri:"Week 1",where:"",lo:"",hi:""}; render(); break;
    case "canceladd":
      state.addingTo = null; render(); break;
    case "addsetpri":
      state.draft.pri = pri; render(); break;
    case "submitadd":
      submitAdd(cat); break;
    case "showaddcat":
      state.addingCat = true; state.newCatName = ""; render(); break;
    case "canceladdcat":
      state.addingCat = false; state.newCatName = ""; render(); break;
    case "submitaddcat":
      submitAddCat(); break;
    case "delcat":
      deleteCat(cat); break;
    case "setsort":
      state.sortMode = el.getAttribute('data-sort'); savePrefs(); render(); break;
    case "renamecat":
      state.renamingCat = cat; state.catRenameDraft = catDisplay(cat); render(); break;
    case "saverenamecat":
      saveRenameCat(cat); break;
    case "cancelrenamecat":
      state.renamingCat = null; state.catRenameDraft = ""; render(); break;
    case "askclear":
      state.confirmClear = true; render(); break;
    case "cancelclear":
      state.confirmClear = false; render(); break;
    case "confirmclear":
      state.checked = {}; state.confirmClear = false; persist(); render(); break;
  }
}

function idKey(rawId){
  // match stored key to the item's actual id type
  var all = allItems();
  for(var i=0;i<all.length;i++){ if(String(all[i].id)===String(rawId)) return all[i].id; }
  return rawId;
}

function ensureEdits(id){ if(!state.edits[id]) state.edits[id] = {}; return state.edits[id]; }

function commitEdit(rawId){
  var id = idKey(rawId);
  var d = state.draftEdits || {};
  var e = ensureEdits(id);
  e.name = d.name; e.pri = d.pri; e.where = d.where;
  e.lo = Number(d.lo)||0; e.hi = Number(d.hi)||0;
  e.note = d.note; e.link = d.link; e.assignee = d.assignee;
  state.editId = null; state.draftEdits = null; state.confirmId = null;
  persist(); render();
}

function setHidden(rawId, val){
  var id = idKey(rawId);
  ensureEdits(id).hidden = val;
  persist();
}

function doDelete(rawId){
  var id = idKey(rawId);
  if(String(id).indexOf("c_")===0){
    state.custom = state.custom.filter(function(i){ return i.id!==id; });
  } else {
    ensureEdits(id).hidden = true;
  }
  state.editId = null; state.draftEdits = null; state.confirmId = null;
  persist(); render();
}

function submitAdd(cat){
  var d = state.draft;
  if(!d.name.trim()) return;
  state.custom.push({
    id:"c_"+Date.now(), cat:cat, name:d.name.trim(), pri:d.pri,
    where:(d.where.trim()||"-"), lo:Number(d.lo)||0, hi:Number(d.hi)||0
  });
  state.draft = {name:"",pri:"Week 1",where:"",lo:"",hi:""};
  state.addingTo = null;
  persist(); render();
}

function submitAddCat(){
  var name = (state.newCatName||"").trim();
  if(!name) return;
  // avoid duplicates (built-in or already-added)
  if(allCats().indexOf(name) === -1){
    state.customCats.push(name);
  }
  state.addingCat = false; state.newCatName = "";
  persist(); render();
}

function deleteCat(cat){
  // remove the category and any custom items inside it
  state.customCats = (state.customCats||[]).filter(function(c){ return c!==cat; });
  state.custom = state.custom.filter(function(i){ return i.cat!==cat; });
  if(state.catNames) delete state.catNames[cat];
  persist(); render();
}

function saveRenameCat(cat){
  var name = (state.catRenameDraft||"").trim();
  if(name){
    if(name===cat){ if(state.catNames) delete state.catNames[cat]; } // reset to original
    else { state.catNames[cat] = name; }
  }
  state.renamingCat = null; state.catRenameDraft = "";
  persist(); render();
}

/* inputs update drafts WITHOUT re-render (preserves focus while typing) */
function handleInput(e){
  var el = e.target;
  var f = el.getAttribute('data-field');
  if(!f) return;
  if(f==="newcat"){
    state.newCatName = el.value;
    var cbtn = document.querySelector('[data-act="submitaddcat"]');
    if(cbtn){ if(el.value.trim()) cbtn.removeAttribute('disabled'); else cbtn.setAttribute('disabled','disabled'); }
  } else if(f==="catrename"){
    state.catRenameDraft = el.value;
    var rbtn = document.querySelector('[data-act="saverenamecat"]');
    if(rbtn){ if(el.value.trim()) rbtn.removeAttribute('disabled'); else rbtn.setAttribute('disabled','disabled'); }
  } else if(f.indexOf("add-")===0){
    var key = f.slice(4);
    state.draft[key] = el.value;
    // toggle Add button enabled state live
    if(key==="name"){
      var btn = document.querySelector('[data-act="submitadd"]');
      if(btn){ if(el.value.trim()) btn.removeAttribute('disabled'); else btn.setAttribute('disabled','disabled'); }
    }
  } else {
    if(!state.draftEdits) state.draftEdits = {};
    state.draftEdits[f] = el.value;
  }
}

function handleKeydown(e){
  var f = e.target.getAttribute && e.target.getAttribute('data-field');
  if(f==="add-name"){
    if(e.key==="Enter"){ var cat=state.addingTo; if(cat) submitAdd(cat); }
    else if(e.key==="Escape"){ state.addingTo=null; render(); }
  } else if(f==="newcat"){
    if(e.key==="Enter"){ submitAddCat(); }
    else if(e.key==="Escape"){ state.addingCat=false; state.newCatName=""; render(); }
  } else if(f==="catrename"){
    if(e.key==="Enter"){ saveRenameCat(state.renamingCat); }
    else if(e.key==="Escape"){ state.renamingCat=null; state.catRenameDraft=""; render(); }
  }
}

/* ─────────── Init ─────────── */
loadPrefs();       // per-device view preferences (sort)
load();            // instant UI from local cache
render();          // render immediately before Firebase even loads
initFirebase();    // connect to shared sync; re-renders when cloud data arrives
var app = document.getElementById("app");
app.addEventListener("click", handleClick);
app.addEventListener("input", handleInput);
app.addEventListener("keydown", handleKeydown);
</script>
</body>
